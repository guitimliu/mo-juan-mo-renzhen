map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 25m;          # 兩張圖各 ≤ 10 MB

  location /api/ {
    proxy_pass http://backend:8000/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;          # WebSocket（/api/cases/{id}/ws 即時進度）
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;         # Bedrock 模式單階段可能數十秒
  }

  location /slides/ {
    proxy_pass http://slides:80/slides/;   # Slidev 靜態簡報（slides 容器）
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
  location = /slides { return 301 $scheme://$http_host/slides/; }   # 保留 port，本機 8091 才不會跳到 80

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(otf|ttf|woff2?)$ {
    expires 30d;
    add_header Cache-Control "public";
  }
}
